name: Deploy Config Server to Fly.io

on:
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to Fly.io
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json

      - name: Check if server folder changed
        id: changes
        run: |
          # Compare against the previous release tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            echo "first release"
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "Comparing with $PREV_TAG"
            if git diff --quiet "$PREV_TAG"...HEAD -- server; then
              echo "No changes in server/"
              echo "changed=false" >> $GITHUB_OUTPUT
            else
              echo "Changes detected in server/"
              echo "changed=true" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Setup Fly.io
        if: steps.changes.outputs.changed == 'true'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install and build server
        if: steps.changes.outputs.changed == 'true'
        working-directory: ./server
        run: |
          npm ci
          npm run build

      - name: Deploy to Fly.io
        if: steps.changes.outputs.changed == 'true'
        run: flyctl deploy --remote-only
        working-directory: ./server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
